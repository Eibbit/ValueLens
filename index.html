<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValueLens - Realtime Color Value Checker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>ValueLens</h1>
            <p>Real-time Grayscale Value Checker</p>
        </header>

        <div id="setup-view" class="view active">
            <div class="instructions">
                <h2>1. Select Source</h2>
                <p>Click the button below to share your drawing application window.</p>
                <button id="btn-start-capture" class="primary-btn">Start Capture</button>
            </div>
            
            <div id="crop-container" class="hidden">
                <h2>2. Select Color Wheel Area</h2>
                <p>Drag the highlighted square over your color wheel, then click confirm.</p>
                <div class="video-wrapper">
                    <video id="source-video" autoplay muted></video>
                    <div id="crop-overlay">
                        <div id="crop-box">
                            <div class="handle nw"></div>
                            <div class="handle ne"></div>
                            <div class="handle sw"></div>
                            <div class="handle se"></div>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button id="btn-confirm-crop" class="primary-btn">Confirm Selection</button>
                    <button id="btn-cancel-crop" class="secondary-btn">Cancel</button>
                </div>
            </div>
        </div>

        <div id="preview-view" class="view hidden">
            <div class="controls-top">
                <button id="btn-reselect" class="secondary-btn">⟵ Reselect</button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="output-canvas"></canvas>
            </div>
            <p class="status-text">Live Grayscale Feed</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
